!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorry</title>
<style>
  @font-face {
    font-family: 'Mangolia Script';
    src: local('Mangolia Script');
  }
 
  * { box-sizing: border-box; }
 
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
 
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffe4ec 0%, #ffd1de 35%, #ffc9d6 60%, #ffe8ef 100%);
    background-size: 300% 300%;
    animation: bgFlow 14s ease infinite;
    position: relative;
  }
 
  @keyframes bgFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
 
  /* ---------- floating decorations ---------- */
  .decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
 
  .heart {
    position: absolute;
    bottom: -60px;
    color: rgba(255, 105, 135, 0.55);
    font-size: 28px;
    animation: floatUp linear infinite;
    user-select: none;
  }
 
  .heart.alt {
    color: rgba(255, 255, 255, 0.75);
  }
 
  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    10% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(20px) rotate(15deg) scale(1); }
    90% { opacity: 1; }
    100% {
      transform: translateY(-105vh) translateX(-15px) rotate(-10deg) scale(1.1);
      opacity: 0;
    }
  }
 
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.9);
    animation: twinkle 2.5s ease-in-out infinite;
  }
 
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.3); }
  }
 
  /* soft glowing blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.5;
    animation: drift 18s ease-in-out infinite;
  }
 
  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.15); }
  }
 
  /* ---------- pages ---------- */
  .page {
    position: relative;
    z-index: 2;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
 
  .page.hidden {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
  }
 
  /* ---------- SORRY text ---------- */
  .sorry-word {
    font-family: 'Mangolia Script', 'Brush Script MT', 'Segoe Script', cursive;
    font-size: clamp(6rem, 22vw, 14rem);
    color: #ff4d7e;
    -webkit-text-stroke: 2px #ffffff;
    paint-order: stroke fill;
    text-shadow:
      0 0 12px rgba(255, 255, 255, 0.9),
      0 0 30px rgba(255, 77, 126, 0.6),
      4px 4px 0 rgba(196, 30, 78, 0.35),
      0 6px 18px rgba(0, 0, 0, 0.15);
    margin: 0;
    line-height: 1;
    animation: gentlePulse 3.5s ease-in-out infinite, appear 1.2s ease;
    letter-spacing: 2px;
  }
 
  @keyframes gentlePulse {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.04) rotate(1deg); }
  }
 
  @keyframes appear {
    0% { opacity: 0; transform: translateY(-40px) scale(0.85); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
 
  .sub-line {
    font-size: 1.1rem;
    color: #b5476b;
    margin-top: -10px;
    margin-bottom: 45px;
    font-style: italic;
    opacity: 0.85;
    animation: appear 1.6s ease;
  }
 
  /* ---------- buttons ---------- */
  .btn-row {
    position: relative;
    display: flex;
    gap: 30px;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    width: min(90vw, 640px);
  }
 
  .btn {
    padding: 16px 30px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    font-family: 'Segoe UI', sans-serif;
  }
 
  .btn-forgive {
    background: linear-gradient(135deg, #ff8fab, #ff6f91);
    color: #fff;
    box-shadow: 0 8px 20px rgba(255, 111, 145, 0.45);
  }
 
  .btn-forgive:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 26px rgba(255, 111, 145, 0.6);
  }
 
  .btn-forgive:active {
    transform: translateY(-1px) scale(0.98);
  }
 
  .btn-flee {
    background: #fff;
    color: #ff6f91;
    border: 2px solid #ffb6c1;
    box-shadow: 0 6px 16px rgba(255, 182, 193, 0.4);
    position: fixed;
    z-index: 5;
  }
 
  .btn-flee.static {
    position: relative;
    z-index: auto;
  }
 
  /* ---------- page two ---------- */
  .thank-title {
    font-family: 'Georgia', serif;
    font-weight: 800;
    font-size: clamp(2.6rem, 8vw, 5rem);
    color: #ff5c8a;
    text-shadow: 0 0 25px rgba(255, 150, 175, 0.6);
    margin: 0 0 18px 0;
    animation: popIn 0.9s cubic-bezier(.26,1.4,.4,1);
  }
 
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.4) rotate(-6deg); }
    70% { transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
 
  .best-line {
    font-family: 'Segoe UI', sans-serif;
    font-size: 1.3rem;
    color: #b5476b;
    font-weight: 500;
    letter-spacing: 1px;
    animation: appear 1.4s ease;
  }
 
  .big-heart {
    font-size: 4rem;
    margin-top: 30px;
    color: #ff6f91;
    animation: beat 1.2s ease-in-out infinite;
  }
 
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    45% { transform: scale(0.95); }
  }
 
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
 
<div class="decor" id="decor"></div>
 
<!-- PAGE 1 -->
<div class="page" id="page1">
  <h1 class="sorry-word">Sorry</h1>
  <p class="sub-line">I truly mean it, from the bottom of my heart 💗</p>
 
  <div class="btn-row" id="btnRow">
    <button class="btn btn-forgive" id="forgiveBtn">I have forgiven</button>
    <button class="btn btn-flee static" id="fleeBtn">I will not forgive</button>
  </div>
</div>
 
<!-- PAGE 2 -->
<div class="page hidden" id="page2">
  <h1 class="thank-title">THANK YOU SO MUCH</h1>
  <p class="best-line">YOU ARE THE BEST</p>
  <div class="big-heart">❤️</div>
</div>
 
<script>
  // ---------- decorative floating hearts & sparkles ----------
  const decor = document.getElementById('decor');
 
  function createHearts(count) {
    const glyphs = ['❤','💗','💕','💖','♡'];
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart' + (Math.random() > 0.6 ? ' alt' : '');
      h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 26) + 'px';
      const duration = 8 + Math.random() * 10;
      h.style.animationDuration = duration + 's';
      h.style.animationDelay = (Math.random() * duration) + 's';
      decor.appendChild(h);
    }
  }
 
  function createSparkles(count) {
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 2.5) + 's';
      decor.appendChild(s);
    }
  }
 
  function createBlobs() {
    const colors = ['#ffb6c1', '#ff9fb3', '#ffe0eb', '#ff8fab'];
    const positions = [
      {top: '10%', left: '5%', size: 260},
      {top: '65%', left: '80%', size: 320},
      {top: '75%', left: '10%', size: 220},
      {top: '5%', left: '70%', size: 240}
    ];
    positions.forEach((p, i) => {
      const b = document.createElement('div');
      b.className = 'blob';
      b.style.top = p.top;
      b.style.left = p.left;
      b.style.width = p.size + 'px';
      b.style.height = p.size + 'px';
      b.style.background = colors[i % colors.length];
      b.style.animationDelay = (i * 2) + 's';
      decor.appendChild(b);
    });
  }
 
  createBlobs();
  createHearts(22);
  createSparkles(18);
 
  // ---------- runaway "I will not forgive" button ----------
  const fleeBtn = document.getElementById('fleeBtn');
  const btnRow = document.getElementById('btnRow');
  let hasEscaped = false;
 
  function moveFleeButton() {
    const margin = 20;
    const btnWidth = fleeBtn.offsetWidth || 200;
    const btnHeight = fleeBtn.offsetHeight || 56;
 
    const maxX = window.innerWidth - btnWidth - margin;
    const maxY = window.innerHeight - btnHeight - margin;
 
    const newX = margin + Math.random() * Math.max(0, maxX - margin);
    const newY = margin + Math.random() * Math.max(0, maxY - margin);
 
    if (!hasEscaped) {
      fleeBtn.classList.remove('static');
      hasEscaped = true;
    }
 
    fleeBtn.style.transition = 'top 0.35s ease, left 0.35s ease';
    fleeBtn.style.left = newX + 'px';
    fleeBtn.style.top = newY + 'px';
  }
 
  fleeBtn.addEventListener('mouseenter', moveFleeButton);
  fleeBtn.addEventListener('click', function(e) {
    e.preventDefault();
    moveFleeButton();
  });
  fleeBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveFleeButton();
  }, { passive: false });
 
  // ---------- forgive button -> page 2 ----------
  const forgiveBtn = document.getElementById('forgiveBtn');
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
 
  forgiveBtn.addEventListener('click', function() {
    page1.classList.add('hidden');
    page2.classList.remove('hidden');
  });
 
  window.addEventListener('resize', function() {
    if (hasEscaped) moveFleeButton();
  });
</script>
 
</body>
</html>
